<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img">
  <title>Cited harvest windows</title>
  <rect width="880" height="460" fill="#f6f3ea"/>
  <text x="24" y="36" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c2420">Cited harvest windows</text>
  <text x="24" y="60" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#4e5a52">Days after sowing. Illustration of published ranges, not a Small Space Greens trial.</text>
  <g font-family="system-ui, Segoe UI, sans-serif" font-size="13" fill="#8a8478">
    <text x="200" y="96">0</text>
    <text x="340" y="96">7</text>
    <text x="480" y="96">14</text>
    <text x="620" y="96">21</text>
    <text x="760" y="96">28</text>
  </g>
  <g font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">
    <text x="24" y="132">Arugula</text>
    <text x="24" y="176">Pea</text>
    <text x="24" y="220">Sunflower</text>
    <text x="24" y="264">Radish</text>
    <text x="24" y="308">Broccoli, kale</text>
    <text x="24" y="352">Basil</text>
    <text x="24" y="396">Cilantro</text>
  </g>
  <!-- scale: day d maps to x = 200 + d * 20 -->
  <g>
    <rect x="320" y="116" width="40" height="18" fill="#245c40"/>
    <rect x="360" y="160" width="40" height="18" fill="#245c40"/>
    <rect x="380" y="204" width="20" height="18" fill="#245c40"/>
    <rect x="360" y="248" width="80" height="18" fill="#245c40"/>
    <rect x="360" y="292" width="80" height="18" fill="#245c40"/>
    <rect x="440" y="336" width="80" height="18" fill="#8a3e12"/>
    <rect x="620" y="380" width="140" height="18" fill="#8a3e12"/>
  </g>
  <text x="24" y="440" font-family="system-ui, Segoe UI, sans-serif" font-size="13" fill="#4e5a52">Green bars: Utah State University Extension harvest estimates. Basil and cilantro use that same table and run longer. Maryland's general microgreen window is about 7 to 21 days.</text>
</svg>
