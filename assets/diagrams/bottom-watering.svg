<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="bwTitle bwDesc">
  <title id="bwTitle">Two-tray bottom watering</title>
  <desc id="bwDesc">A drained growing tray sits inside a solid tray. Water is poured into the solid tray, then poured out after the mix is moist.</desc>
  <rect width="880" height="420" fill="#f6f3ea"/>
  <g font-family="system-ui, Segoe UI, sans-serif" fill="#1c2420">
    <text x="24" y="36" font-size="22" font-weight="700">Bottom watering, in three views</text>
    <text x="24" y="64" font-size="15" fill="#4e5a52">A diagram, not a photo of a tested tray.</text>
  </g>
  <g>
    <text x="40" y="110" font-size="16" font-weight="700" fill="#17382a">1. Drained tray</text>
    <rect x="40" y="130" width="220" height="36" rx="4" fill="#245c40"/>
    <rect x="52" y="142" width="196" height="16" fill="#e7efe8"/>
    <circle cx="78" cy="166" r="4" fill="#17382a"/>
    <circle cx="110" cy="166" r="4" fill="#17382a"/>
    <circle cx="142" cy="166" r="4" fill="#17382a"/>
    <circle cx="174" cy="166" r="4" fill="#17382a"/>
    <circle cx="206" cy="166" r="4" fill="#17382a"/>
    <text x="40" y="210" font-size="14" fill="#1c2420">Holes in the bottom.</text>
    <text x="40" y="230" font-size="14" fill="#1c2420">Mix and seed go here.</text>
  </g>
  <g>
    <text x="330" y="110" font-size="16" font-weight="700" fill="#17382a">2. Solid tray</text>
    <rect x="330" y="150" width="220" height="48" rx="4" fill="#8a3e12"/>
    <rect x="342" y="168" width="196" height="18" fill="#d7e6f2"/>
    <text x="330" y="224" font-size="14" fill="#1c2420">No holes. This holds water.</text>
    <text x="330" y="244" font-size="14" fill="#1c2420">Do not sow in this tray.</text>
  </g>
  <g>
    <text x="620" y="110" font-size="16" font-weight="700" fill="#17382a">3. Nested, then drain</text>
    <rect x="620" y="148" width="220" height="52" rx="4" fill="#8a3e12"/>
    <rect x="632" y="160" width="196" height="14" fill="#d7e6f2"/>
    <rect x="636" y="128" width="188" height="28" rx="3" fill="#245c40"/>
    <text x="620" y="224" font-size="14" fill="#1c2420">Set the drained tray inside.</text>
    <text x="620" y="244" font-size="14" fill="#1c2420">Pour out leftover water.</text>
  </g>
  <text x="24" y="320" font-size="16" fill="#1c2420">Water moves up through the holes. Leaves stay drier than with a pour from above.</text>
  <text x="24" y="348" font-size="16" fill="#1c2420">Utah State's coir example waits about 30 minutes, then discards what is left.</text>
  <text x="24" y="376" font-size="16" fill="#1c2420">A Cornell seed-starting handout says no more than about an hour. Those are examples, not one timer for every mix.</text>
</svg>
