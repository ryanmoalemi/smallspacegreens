<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 544" role="img"><title>Seed grams per 10 by 20 inch tray</title><rect width="880" height="544" fill="#f6f3ea"/><text x="24" y="36" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c2420">Grams per 10 by 20 inch tray</text><text x="24" y="60" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#4e5a52">Utah State crop rates used by the calculator. Illustration, not a trial.</text><text x="24" y="94" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Arugula</text><rect x="160" y="78" width="34" height="20" fill="#245c40"/><text x="202" y="94" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">10 g</text><text x="24" y="130" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Broccoli</text><rect x="160" y="114" width="97" height="20" fill="#245c40"/><text x="265" y="130" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">28 g</text><text x="24" y="166" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Kale</text><rect x="160" y="150" width="97" height="20" fill="#245c40"/><text x="265" y="166" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">28 g</text><text x="24" y="202" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Cilantro</text><rect x="160" y="186" width="97" height="20" fill="#245c40"/><text x="265" y="202" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">28 g</text><text x="24" y="238" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Basil</text><rect x="160" y="222" width="97" height="20" fill="#245c40"/><text x="265" y="238" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">28 g</text><text x="24" y="274" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Rutabaga</text><rect x="160" y="258" width="97" height="20" fill="#245c40"/><text x="265" y="274" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">28 g</text><text x="24" y="310" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Radish</text><rect x="160" y="294" width="145" height="20" fill="#245c40"/><text x="313" y="310" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">42 g</text><text x="24" y="346" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Sunflower</text><rect x="160" y="330" width="166" height="20" fill="#245c40"/><text x="334" y="346" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">48 g</text><text x="24" y="382" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Pea</text><rect x="160" y="366" width="520" height="20" fill="#245c40"/><text x="688" y="382" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#17382a">150 g</text><text x="24" y="428" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#1c2420">Maryland example</text><rect x="160" y="414" width="52" height="20" fill="#e7d7b8" stroke="#8a3e12"/><rect x="160" y="414" width="34" height="20" fill="#c4a574"/><text x="228" y="428" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#8a3e12">10 to 15 g, not a crop rate</text><text x="24" y="520" font-family="system-ui, Segoe UI, sans-serif" font-size="13" fill="#4e5a52">Source: Utah State University Extension grams per 1020 tray. The tan bar is University of Maryland Extension's general broadcast example for crops without a Utah State rate.</text></svg>