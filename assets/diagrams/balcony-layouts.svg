<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="blTitle blDesc">
  <title id="blTitle">Two example balcony layouts</title>
  <desc id="blDesc">A short-sun layout with lettuce pots and a brighter layout that can include radishes. These are sketches, not a structural load calculation.</desc>
  <rect width="880" height="420" fill="#f6f3ea"/>
  <text x="24" y="34" font-size="22" font-weight="700" font-family="system-ui, Segoe UI, sans-serif" fill="#1c2420">Two sketches, not a load rating</text>
  <text x="24" y="58" font-size="14" font-family="system-ui, Segoe UI, sans-serif" fill="#4e5a52">Pot widths follow a UC ANR container handout. Sun hours are that handout's thresholds. Weight is not calculated here.</text>
  <rect x="24" y="80" width="400" height="310" fill="#fffdf8" stroke="#d7d0c3"/>
  <text x="40" y="108" font-size="16" font-weight="700" font-family="system-ui, Segoe UI, sans-serif" fill="#17382a">Layout A: about 3 hours of sun</text>
  <text x="40" y="132" font-size="14" font-family="system-ui, Segoe UI, sans-serif" fill="#1c2420">Leafy crops only. No radishes in this sketch.</text>
  <circle cx="110" cy="210" r="42" fill="#e7efe8" stroke="#17382a" stroke-width="3"/>
  <text x="78" y="214" font-size="13" font-family="system-ui, Segoe UI, sans-serif">8 in lettuce</text>
  <circle cx="230" cy="210" r="42" fill="#e7efe8" stroke="#17382a" stroke-width="3"/>
  <text x="198" y="214" font-size="13" font-family="system-ui, Segoe UI, sans-serif">8 in lettuce</text>
  <circle cx="160" cy="310" r="36" fill="#d5e4d8" stroke="#17382a" stroke-width="3"/>
  <text x="128" y="314" font-size="12" font-family="system-ui, Segoe UI, sans-serif">herbs</text>
  <text x="40" y="368" font-size="13" font-family="system-ui, Segoe UI, sans-serif" fill="#4e5a52">Leave a path to water and to empty saucers.</text>
  <rect x="450" y="80" width="406" height="310" fill="#fffdf8" stroke="#d7d0c3"/>
  <text x="466" y="108" font-size="16" font-weight="700" font-family="system-ui, Segoe UI, sans-serif" fill="#17382a">Layout B: about 4 or more hours</text>
  <text x="466" y="132" font-size="14" font-family="system-ui, Segoe UI, sans-serif" fill="#1c2420">Leafy pots plus one radish or scallion pot.</text>
  <circle cx="540" cy="210" r="42" fill="#e7efe8" stroke="#17382a" stroke-width="3"/>
  <text x="508" y="214" font-size="13" font-family="system-ui, Segoe UI, sans-serif">8 in lettuce</text>
  <rect x="620" y="170" width="90" height="90" fill="#f3e2c4" stroke="#17382a" stroke-width="3"/>
  <text x="632" y="220" font-size="13" font-family="system-ui, Segoe UI, sans-serif">10 in roots</text>
  <circle cx="780" cy="300" r="36" fill="#d5e4d8" stroke="#17382a" stroke-width="3"/>
  <text x="756" y="304" font-size="12" font-family="system-ui, Segoe UI, sans-serif">herbs</text>
  <text x="466" y="368" font-size="13" font-family="system-ui, Segoe UI, sans-serif" fill="#4e5a52">Fruiting crops want about 6 to 10 hours. They are not in these sketches.</text>
</svg>
