name: IndexNow

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Ping IndexNow for changed URLs
        env:
          SSG_INDEXNOW_BASE: HEAD~1
        run: python3 scripts/ping_indexnow.py
